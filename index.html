<style>
  :root { --bg: #100d18; --surface: #1c1729; --line: #332b46; --text: #f4f0fb; --muted: #9089a6; --aura: #b46bff; --aura-2: #ff5fc4; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(60% 50% at 50% 0%, rgba(180,107,255,0.16), transparent 70%), var(--bg);
    color: var(--text); font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px 16px; box-sizing: border-box;
  }
  main { width: 100%; max-width: 380px; text-align: center; display: flex; flex-direction: column; gap: 14px; }
  img { width: 96px; height: 96px; margin: 0 auto; image-rendering: pixelated; border-radius: 12px; }
  h1 { margin: 0; font-size: 1.8rem; letter-spacing: 0.02em;
       background: linear-gradient(90deg, var(--text), var(--aura-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { margin: 0 0 6px; color: var(--muted); }
  a.btn { display: block; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--aura); color: var(--text);
          background: var(--surface); text-decoration: none; font-weight: 600; }
  a.btn:hover, a.btn:focus-visible { background: #241d34; outline: none; }
  a.btn span { display: block; font-weight: 400; font-size: 0.85rem; color: var(--muted); }
</style>
